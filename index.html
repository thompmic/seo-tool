<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free SEO Meta Tag Generator — No Signup Required</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #222; line-height: 1.6; }
  h1 { font-size: 1.8rem; margin-bottom: 0.3rem; }
  .sub { color: #666; margin-top: 0; margin-bottom: 2rem; }
  label { display: block; font-weight: 600; margin: 1rem 0 0.3rem; }
  input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; box-sizing: border-box; }
  textarea { height: 80px; resize: vertical; }
  #preview { background: #f5f5f5; border: 1px solid #ddd; border-radius: 6px; padding: 16px; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; word-break: break-all; min-height: 120px; margin-top: 1.5rem; }
  button { background: #222; color: #fff; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 6px; cursor: pointer; margin-top: 1rem; width: 100%; }
  button:hover { background: #000; }
  #copyStatus { color: green; font-size: 0.9rem; margin-top: 0.5rem; text-align: center; min-height: 1.2rem; }
  .upsell { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid #eee; font-size: 0.95rem; color: #555; text-align: center; }
  .upsell a { color: #222; font-weight: 600; }
</style>
</head>
<body>

<h1>Free SEO Meta Tag Generator</h1>
<p class="sub">Fill in the fields below. Your tags update live. No signup required.</p>

<label for="title">Page Title</label>
<input type="text" id="title" placeholder="e.g., Best Coffee Grinders for Home Use" value="">

<label for="desc">Meta Description (150–160 chars)</label>
<textarea id="desc" placeholder="e.g., We tested 12 coffee grinders. Here are the 5 best for home use, based on grind consistency, price, and durability."></textarea>

<label for="url">Page URL</label>
<input type="text" id="url" placeholder="https://example.com/best-coffee-grinders">

<label for="image">Image URL (optional)</label>
<input type="text" id="image" placeholder="https://example.com/coffee-grinder.jpg">

<div id="preview">Your generated tags will appear here as you type.</div>

<button onclick="copyTags()">Copy All Tags</button>
<div id="copyStatus"></div>

<div class="upsell">
  Want to make sure your tags actually work? <a href="https://michaeldev6.gumroad.com/l/yvksn" target="_blank">Get the 5-Minute SEO Checklist ($9)</a>
</div>

<script>
function generateTags() {
  const title = document.getElementById('title').value.trim();
  const desc = document.getElementById('desc').value.trim();
  const url = document.getElementById('url').value.trim();
  const image = document.getElementById('image').value.trim();

  let tags = '';

  if (title) {
    tags += `<title>${escapeHtml(title)}</title>\n`;
    tags += `<meta property="og:title" content="${escapeHtml(title)}">\n`;
    tags += `<meta name="twitter:title" content="${escapeHtml(title)}">\n`;
  }
  if (desc) {
    tags += `<meta name="description" content="${escapeHtml(desc)}">\n`;
    tags += `<meta property="og:description" content="${escapeHtml(desc)}">\n`;
    tags += `<meta name="twitter:description" content="${escapeHtml(desc)}">\n`;
  }
  if (url) {
    tags += `<link rel="canonical" href="${escapeHtml(url)}">\n`;
    tags += `<meta property="og:url" content="${escapeHtml(url)}">\n`;
  }
  if (image) {
    tags += `<meta property="og:image" content="${escapeHtml(image)}">\n`;
    tags += `<meta name="twitter:image" content="${escapeHtml(image)}">\n`;
  }
  if (title || desc || url) {
    tags += `<meta property="og:type" content="website">\n`;
    tags += `<meta name="twitter:card" content="${image ? 'summary_large_image' : 'summary'}">\n`;
  }

  document.getElementById('preview').textContent = tags || 'Your generated tags will appear here as you type.';
  return tags;
}

function escapeHtml(str) {
  return str.replace(/[&<>"]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    if (m === '"') return '&quot;';
    return m;
  });
}

function copyTags() {
  const tags = generateTags();
  if (!tags) {
    document.getElementById('copyStatus').textContent = 'Nothing to copy yet. Fill in at least one field.';
    return;
  }
  navigator.clipboard.writeText(tags).then(() => {
    document.getElementById('copyStatus').textContent = 'Copied to clipboard!';
    setTimeout(() => { document.getElementById('copyStatus').textContent = ''; }, 2500);
  }).catch(() => {
    document.getElementById('copyStatus').textContent = 'Copy failed. Select the preview text manually.';
  });
}

document.querySelectorAll('input, textarea').forEach(el => {
  el.addEventListener('input', generateTags);
});
</script>
</body>
</html>
